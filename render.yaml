services:
  - type: web
    name: uttaradit-announcement-register
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uttaradit-announcement-register-db
          property: connectionString
      - key: EDITOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: uttaradit-announcement-register-db
    region: singapore
    plan: free

