services:
  - type: web
    name: uttaradit-announcement-register
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: EDITOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

