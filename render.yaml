services:
  - type: web
    name: uttaradit-announcement-register
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EDITOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

